title: "Marcia Mount Shoop — Site Prototypes"
tagline: Author, theologian, and speaker on embodiment, trauma, and healing
description: >-
  Internal prototype hub for the marciamountshoop.com redesign. Not the
  live site — for client review of design directions only.
url: "https://davidauble.com"
baseurl: "/mms_prototypes"
lang: en_US
locale: en_US
author:
  name: Marcia Mount Shoop

social_links:
  facebook: "https://www.facebook.com/TheRev.MarciaMountShoopPhD"
  instagram: "https://www.instagram.com/mountshoop/"
  # Still a placeholder — kept in place because options 1a/3a/7a still
  # link to it. Option 2a no longer references social_links.x anywhere.
  x: "https://x.com/"
  # GCPC's YouTube channel/podcasts tab — used for the general "YouTube"
  # link (footer, follow-along, Talks page) as well as the "GCPC Podcast" link.
  youtube: "https://www.youtube.com/@GCPCUSA/podcasts"
  substack: "https://marciawhitneymountshoop.substack.com/"
  threads: "https://www.threads.net/@mountshoop"

affiliate_disclosure: >-
  As an Amazon Associate and Bookshop.org affiliate, Marcia earns from
  qualifying purchases.

# Cloudflare Turnstile site key for the contact/inquiry forms. This is
# the public *test* key (always passes) — swap for the real Site Key
# from the Cloudflare dashboard once cf-worker is deployed. See
# cf-worker/README.md.
turnstile_site_key: "1x00000000000000000000AA"

# jekyll-seo-tag / jekyll-sitemap read these
twitter:
  card: summary_large_image
  username: ""
social:
  name: Marcia Mount Shoop
  links:
    - "https://www.facebook.com/TheRev.MarciaMountShoopPhD"
    - "https://www.instagram.com/mountshoop/"
    - "https://www.youtube.com/@GCPCUSA/podcasts"
    - "https://www.threads.net/@mountshoop"

collections:
  books_3a:
    output: true
    permalink: /options/3a/books/:path/
  writing_3a:
    output: true
    permalink: /options/3a/writing-and-talks/:path/
  books_1a:
    output: true
    permalink: /options/1a/books/:path/
  writing_1a:
    output: true
    permalink: /options/1a/writing-and-talks/:path/
  books_2a:
    output: true
    permalink: /options/2a/books/:path/
  writing_2a:
    output: true
    permalink: /options/2a/writing-and-talks/:path/
  books_7a:
    output: true
    permalink: /options/7a/books/:path/
  writing_7a:
    output: true
    permalink: /options/7a/writing-and-talks/:path/

defaults:
  - scope:
      path: "options/3a"
      type: "pages"
    values:
      layout: "default-3a"
      variant: "3a"
  - scope:
      path: ""
      type: "books_3a"
    values:
      layout: "book-3a"
      variant: "3a"
  - scope:
      path: ""
      type: "writing_3a"
    values:
      layout: "writing-entry-3a"
      variant: "3a"
  - scope:
      path: "options/1a"
      type: "pages"
    values:
      layout: "default-1a"
      variant: "1a"
  - scope:
      path: ""
      type: "books_1a"
    values:
      layout: "book-1a"
      variant: "1a"
  - scope:
      path: ""
      type: "writing_1a"
    values:
      layout: "writing-entry-1a"
      variant: "1a"
  - scope:
      path: "options/2a"
      type: "pages"
    values:
      layout: "default-2a"
      variant: "2a"
  - scope:
      path: ""
      type: "books_2a"
    values:
      layout: "book-2a"
      variant: "2a"
  - scope:
      path: ""
      type: "writing_2a"
    values:
      layout: "writing-entry-2a"
      variant: "2a"
  - scope:
      path: "options/7a"
      type: "pages"
    values:
      layout: "default-7a"
      variant: "7a"
  - scope:
      path: ""
      type: "books_7a"
    values:
      layout: "book-7a"
      variant: "7a"
  - scope:
      path: ""
      type: "writing_7a"
    values:
      layout: "writing-entry-7a"
      variant: "7a"

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - cf-worker
