title: "Marcia Mount Shoop — Site Prototype"
tagline: Author, theologian, and speaker on embodiment, trauma, and healing
description: >-
  Internal prototype for the marciamountshoop.com redesign. Not the
  live site — for client review only.
url: "https://davidauble.com"
baseurl: "/mms_prototypes"
lang: en-US
locale: en_US
author:
  name: Marcia Mount Shoop

social_links:
  facebook: "https://www.facebook.com/TheRev.MarciaMountShoopPhD"
  instagram: "https://www.instagram.com/mountshoop/"
  # Still a placeholder — used in schema-person.html's sameAs list.
  x: "https://x.com/"
  # GCPC's YouTube channel/podcasts tab — used for the general "YouTube"
  # link (footer, follow-along, Talks page) as well as the "GCPC Podcast" link.
  youtube: "https://www.youtube.com/@GCPCUSA/podcasts"
  substack: "https://marciawhitneymountshoop.substack.com/"
  threads: "https://www.threads.net/@mountshoop"

affiliate_disclosure: >-
  As an Amazon Associate and Bookshop.org affiliate, Marcia earns from
  qualifying purchases.

# Cloudflare Turnstile site key for the contact/inquiry forms. Real
# Site Key from the Cloudflare dashboard. The cf-worker validates the
# returned action and hostname server-side and reads the matching Worker
# secret from `TURNSTILE_SECRET` (preferred) or the legacy
# `TURNSTILE_SECRET_KEY` binding. See cf-worker/README.md.
turnstile_site_key: "0x4AAAAAAEQyGPxr98IJZP5r"

# jekyll-seo-tag / jekyll-sitemap read these
twitter:
  card: summary_large_image
  username: ""
social:
  name: Marcia Mount Shoop
  links:
    - "https://www.facebook.com/TheRev.MarciaMountShoopPhD"
    - "https://www.instagram.com/mountshoop/"
    - "https://www.youtube.com/@GCPCUSA/podcasts"
    - "https://www.threads.net/@mountshoop"

collections:
  books:
    output: true
    permalink: /books/:path/
  writing:
    output: true
    permalink: /writing-and-talks/:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "books"
    values:
      layout: "book"
  - scope:
      path: ""
      type: "writing"
    values:
      layout: "writing-entry"

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - cf-worker
